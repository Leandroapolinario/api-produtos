name: CI - API Produtos

on:
  # PRs para develop/main: roda build + testes (validação antes do merge)
  pull_request:
    branches: [ main, develop ]
  # Merge na main: roda build + testes + publica a imagem no Docker Hub
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build # só roda se o build passar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Test with Maven
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  docker:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    # Imagem só é publicada quando o código chega na main (após PR aprovado)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Definir versão
        id: vars
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_COMMIT=${{ steps.vars.outputs.sha_short }}
          # "latest" é a tag monitorada pelo Watchtower na EC2
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-produtos:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-produtos:${{ steps.vars.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-produtos:${{ steps.vars.outputs.sha_short }}
