name: CI - API Produtos

on:
  # PRs para develop/main: roda build + testes (validação antes do merge)
  pull_request:
    branches: [ main, develop ]
  # Merge na main: roda build + testes + publica a imagem no Docker Hub
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build # só roda se o build passar
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Test with Maven
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  docker:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    # Em PR: só builda a imagem (valida o Dockerfile), sem login nem push.
    # Na main: builda e publica no Docker Hub (Watchtower atualiza a EC2).
    env:
      PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      IMAGEM: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/api-produtos-01251069
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Definir versão
        id: vars
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (e push na main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_COMMIT=${{ steps.vars.outputs.sha_short }}
          # "latest" é a tag monitorada pelo Watchtower na EC2
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ steps.vars.outputs.version }}
            ${{ env.IMAGEM }}:${{ steps.vars.outputs.sha_short }}
