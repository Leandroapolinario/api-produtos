spring.application.name=api-produtos
server.port=8080

# Preenchidos no build da imagem Docker pelo GitHub Actions (build-args -> ENV)
app.versao=${APP_VERSION:local}
app.commit=${APP_COMMIT:local}
# Altere esta mensagem e faça push para demonstrar o deploy automático
app.mensagem=Versao 1 - API de Produtos no ar!

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
